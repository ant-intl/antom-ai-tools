name: skills-sync-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine provider check scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA...$HEAD_SHA" -- skills/ providers/ scripts/sync-skills.mjs; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Provider check not applicable: this PR does not change skills, provider copies, or the sync script." >> "$GITHUB_STEP_SUMMARY"
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              echo "::error::Unable to determine changed paths"
              exit "$result"
            fi
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify provider skill directories match source
        if: steps.scope.outputs.required == 'true'
        run: |
          out_of_sync=false

          for skill_dir in skills/*/; do
            skill_name="$(basename "$skill_dir")"

            for target in \
              "providers/cursor/plugin/skills/$skill_name" \
              "providers/claude/plugin/skills/$skill_name" \
              "providers/codex/plugins/antom-integration/skills/$skill_name"; do

              if [ ! -d "$target" ]; then
                echo "::error::$target is missing"
                out_of_sync=true
                continue
              fi

              if ! diff -r "skills/$skill_name" "$target" > /dev/null 2>&1; then
                echo "::error::$target is out of sync with skills/$skill_name"
                diff -r "skills/$skill_name" "$target" || true
                out_of_sync=true
              fi
            done
          done

          if [ "$out_of_sync" = true ]; then
            echo ""
            echo "Fix: run 'npm run sync-skills' and commit the result."
            exit 1
          fi

          echo "✅ All provider skill directories are in sync."

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run test:skills
      - name: Verify release packaging (no publication)
        run: bun run skills:build v0.0.0
