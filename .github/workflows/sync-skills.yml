name: sync-skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/sync-skills.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Avoid self-trigger loops when the workflow's own PR is merged.
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync-skills
        run: npm run sync-skills

      - name: Detect provider drift
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with synced provider copies
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync provider skill copies"
          title: "chore: sync provider skill copies"
          body: |
            Auto-generated by the **sync-skills** workflow.

            The source-of-truth `skills/` directory changed. This PR mirrors
            the updated content into every provider plugin package via
            `npm run sync-skills`.
          branch: chore/sync-skills
          delete-branch: true
          labels: automation
