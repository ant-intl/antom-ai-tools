name: sync-skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/sync-skills.mjs'
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        type: choice
        default: sync
        options: [sync, prepare-release, download-stats]
      version:
        description: 'Release version (prepare-release only): vX.Y.Z'
        type: string
        required: false

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    # Avoid self-trigger loops when the workflow's own PR is merged.
    if: ${{ github.actor != 'github-actions[bot]' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'sync') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync-skills
        run: npm run sync-skills

      - name: Detect provider drift
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with synced provider copies
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync provider skill copies"
          title: "chore: sync provider skill copies"
          body: |
            Auto-generated by the **sync-skills** workflow.

            The source-of-truth `skills/` directory changed. This PR mirrors
            the updated content into every provider plugin package via
            `npm run sync-skills`.
          branch: chore/sync-skills
          delete-branch: true
          labels: automation

  prepare-release:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-release'
    runs-on: ubuntu-latest
    concurrency:
      group: skills-release-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Require main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run test:skills
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLS_VERSION: ${{ inputs.version }}
        run: bun run skills:prepare "$SKILLS_VERSION"

  download-stats:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'download-stats'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - name: Read cumulative download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run skills:stats
      - uses: actions/upload-artifact@v4
        with:
          name: skill-download-report-${{ github.run_id }}
          path: dist/skills-stats/
          if-no-files-found: error
          retention-days: 30
